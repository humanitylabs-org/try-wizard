# Mac-only local ingress. Only vsock and guest loopback reach this listener.
# Strip caller-supplied proxy identity; the local native bridge represents the owner (local-proxy-owner.inc).
pid /run/wizard-local-proxy.pid;
# Root workers, like tailscaled: the App Manager's Store and Updates listener answers only a root-owned peer
# (wam store: "only reachable through tailscale serve"). Only vsock and guest loopback reach this listener.
user root root;
error_log stderr warn;
events { worker_connections 128; }
http {
  access_log off;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  # Allow the main shell's HEAD-only launch confirmation across the isolated app origin.
  map "$request_method:$http_origin" $wizard_app_probe_origin {
    default "";
    "HEAD:http://127.0.0.1:48023" "http://127.0.0.1:48023";
  }
  # Exact authority, including port: nginx server_name alone ignores the port.
  map $http_host $wizard_control_host { default 0; "127.0.0.1:48023" 1; }
  map $http_host $wizard_apps_host { default 0; "localhost:48023" 1; }
  server { listen 127.0.0.1:8924 default_server; server_name _; return 421; }
  server {
    listen 127.0.0.1:8924;
    server_name 127.0.0.1;
    if ($wizard_control_host = 0) { return 421; }
    client_max_body_size 256m;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 900s;
    # The shell port and the same path table Tailscale Serve uses for the owner's phone (wizard-local-routes).
    include /run/wizard-local-proxy/shell.conf;
    include /run/wizard-local-proxy/routes.conf;
    location / {
      proxy_pass $wz_shell;
      include /opt/wizard/local-proxy-owner.inc;
    }
  }
  # Same native TCP bridge, different browser origin: apps cannot read Wizard's control plane.
  # This listener still authenticates the local owner, but can serve app routes only.
  server {
    listen 127.0.0.1:8924;
    server_name localhost;
    if ($wizard_apps_host = 0) { return 421; }
    client_max_body_size 16m;
    location /apps/ {
      proxy_pass http://127.0.0.1:8798;
      add_header Access-Control-Allow-Origin $wizard_app_probe_origin always;
      add_header Vary Origin always;
      include /opt/wizard/local-proxy-owner.inc;
      proxy_set_header Cookie "";
      proxy_set_header Authorization "";
      proxy_buffering off;
    }
    location / { return 404; }
  }
}
