# Mac-only local ingress. Only vsock and guest loopback reach this listener.
# Strip caller-supplied proxy identity; the local native bridge represents the owner.
pid /run/wizard-local-proxy.pid;
error_log stderr warn;
events { worker_connections 128; }
http {
  access_log off;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  # Allow the main shell's HEAD-only launch confirmation across the isolated app origin.
  map "$request_method:$http_origin" $wizard_app_probe_origin {
    default "";
    "HEAD:http://127.0.0.1:48023" "http://127.0.0.1:48023";
  }
  # Exact authority, including port: nginx server_name alone ignores the port.
  map $http_host $wizard_control_host { default 0; "127.0.0.1:48023" 1; }
  map $http_host $wizard_apps_host { default 0; "localhost:48023" 1; }
  server { listen 127.0.0.1:8924 default_server; server_name _; return 421; }
  server {
    listen 127.0.0.1:8924;
    server_name 127.0.0.1;
    if ($wizard_control_host = 0) { return 421; }
    client_max_body_size 256m;
    location / {
      proxy_pass http://127.0.0.1:8796;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header Tailscale-User-Login owner@wizard.local;
      proxy_set_header Forwarded "";
      proxy_set_header X-Forwarded-For "";
      proxy_set_header X-Forwarded-Host "";
      proxy_set_header X-Forwarded-Proto "";
      proxy_set_header CF-Access-Jwt-Assertion "";
      proxy_set_header CF-Connecting-IP "";
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_read_timeout 900s;
    }
  }
  # Same native TCP bridge, different browser origin: apps cannot read Wizard's control plane.
  # This listener still authenticates the local owner, but can serve app routes only.
  server {
    listen 127.0.0.1:8924;
    server_name localhost;
    if ($wizard_apps_host = 0) { return 421; }
    client_max_body_size 16m;
    location /apps/ {
      proxy_pass http://127.0.0.1:8798;
      add_header Access-Control-Allow-Origin $wizard_app_probe_origin always;
      add_header Vary Origin always;
      proxy_set_header Host $http_host;
      proxy_set_header Tailscale-User-Login owner@wizard.local;
      proxy_set_header Forwarded "";
      proxy_set_header X-Forwarded-For "";
      proxy_set_header X-Forwarded-Host "";
      proxy_set_header X-Forwarded-Proto "";
      proxy_set_header Cookie "";
      proxy_set_header Authorization "";
      proxy_buffering off;
    }
    location / { return 404; }
  }
}
