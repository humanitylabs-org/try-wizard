# WizardOS on a Mac (try-wizard#155): a second DNS route next to the Mac's NAT DNS (192.168.64.1, from DHCP).
# Some Mac setups (Tailscale's MagicDNS in front of macOS's resolver, for one) make that forwarder answer a few names
# with the truncated bit set and an unusable TCP retry, so names like pkg-containers.githubusercontent.com (GHCR's
# image layers) never resolve and WizardOS updates fail and roll back.
# With these servers set and no Domains= line, systemd-resolved asks them and the NAT DNS in parallel and keeps the
# positive answer: public names resolve even when the NAT mangles them, and names only the Mac knows (tailnet
# *.ts.net, the local network) still come from the NAT. Do not add Domains=~. here: it routes every name to these
# servers alone and tailnet names stop resolving.
[Resolve]
DNS=1.1.1.1 9.9.9.9
