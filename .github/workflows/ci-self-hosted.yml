name: CI (self-hosted Mac fallback)

# Manual fallback only, for when GitHub-hosted macOS is unavailable or a check
# needs the team Mac. workflow_dispatch can only be started by users with write
# access, so no fork or PR code reaches the self-hosted machine once public.
# Delete this file (and deregister the runner) if the hosted runners prove stable.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.target == 'test' && 'Tests' || 'Build' }} (self-hosted Mac, ARM64)
    strategy:
      fail-fast: false
      matrix:
        target: [test, runtime]
    runs-on: [self-hosted, macOS, ARM64, try-wizard]
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify runner scheduling contracts
        run: python3 tests/test-ci-worker-lock.py

      - name: Install guest HTTP test dependencies in an isolated environment
        if: matrix.target == 'test'
        run: |
          python3 -m venv "$RUNNER_TEMP/backup-tests-${GITHUB_RUN_ID}"
          "$RUNNER_TEMP/backup-tests-${GITHUB_RUN_ID}/bin/python" -m pip install -r next/guest/tests/requirements.txt
          printf '%s\n' "$RUNNER_TEMP/backup-tests-${GITHUB_RUN_ID}/bin" >> "$GITHUB_PATH"

      - name: Run test suite
        if: matrix.target == 'test'
        run: python3 scripts/ci-with-worker-lock.py make test

      - name: Install runtime build tool
        if: matrix.target == 'runtime'
        run: command -v pkg-config || brew install pkg-config

      - name: Build and verify native runtime
        if: matrix.target == 'runtime'
        run: python3 scripts/ci-with-worker-lock.py make runtime
