# Agent review on every PR (WizardOS team rule, 23 Oct 2026). The reviewer lives in one place,
# humanitylabs-org/wizard-ux .github/workflows/pr-agent-review.yml; this file only calls it.
# It reads the PR through the GitHub API and never checks out or runs PR code.
name: Agent review
on:
  # Private same-repository PRs use the candidate caller; reviewer code stays on trusted main.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  pull-requests: write
jobs:
  review:
    if: github.event.pull_request.head.repo.full_name == github.repository
    # GitHub-hosted (the reviewer's default, ubuntu-latest): the repo is public, so hosted minutes are free and no
    # self-hosted runner is needed (try-wizard#113, wizard-os#680).
    uses: humanitylabs-org/wizard-ux/.github/workflows/pr-agent-review.yml@main
