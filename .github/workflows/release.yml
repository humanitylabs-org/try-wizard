name: Release

# Builds a release DMG for a vX.Y.Z tag.
#  - Guest image: self-hosted Linux runner (Docker, linux/arm64); hosted macOS
#    has no nested virtualisation, so it cannot run the guest build.
#  - App + DMG: GitHub-hosted macos-15.
#  - Signing/notarisation happen ONLY when all five secrets exist:
#      MACOS_CERT_P12 (base64 Developer ID Application .p12), MACOS_CERT_PASSWORD,
#      ASC_KEY_P8 (App Store Connect API key .p8 contents), ASC_KEY_ID, ASC_ISSUER_ID.
#    Otherwise the DMG is built ad-hoc signed, NOT notarised, and labelled unsigned.
# Output is always a DRAFT GitHub release; a maintainer verifies and publishes it.
# Both triggers require write access, so no fork code reaches the self-hosted runner.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build (vX.Y.Z)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  guest:
    name: Guest image (Linux, Docker)
    runs-on: [self-hosted, Linux, X64, forum, try-wizard]
    timeout-minutes: 180
    steps:
      - name: Validate tag
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::invalid tag $RELEASE_TAG"; exit 1; }

      - name: Check out tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
          fetch-depth: 0

      - name: Build guest artifacts
        run: guest/build-container.sh --output "$GITHUB_WORKSPACE/dist/guest"

      - name: Upload guest artifacts
        uses: actions/upload-artifact@v4
        with:
          name: guest-${{ env.RELEASE_TAG }}
          path: dist/guest/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  app:
    name: App + DMG (macos-15)
    needs: guest
    runs-on: macos-15
    timeout-minutes: 120
    permissions:
      contents: write   # draft GitHub release
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - name: Check out tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
          fetch-depth: 0

      - name: Require a clean release version
        run: python3 scripts/app_version.py --root "$GITHUB_WORKSPACE" --require-release

      - name: Download guest artifacts
        uses: actions/download-artifact@v4
        with:
          name: guest-${{ env.RELEASE_TAG }}
          path: dist/guest

      - name: Install runtime build tool
        run: command -v pkg-config || brew install pkg-config

      - name: Toolchain cache key
        id: toolchain
        run: |
          key=$(printf '%s|%s|%s|%s' "${ImageOS:-macos}" "${ImageVersion:-local}" \
            "$(sw_vers -productVersion)" "$(xcrun clang --version | head -1)" | shasum -a 256 | cut -c1-16)
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Restore native runtime build
        uses: actions/cache/restore@v4
        with:
          path: |
            macos/.build/qemu-gpu-runtime
            .build/state/runtime.json
          key: runtime-${{ steps.toolchain.outputs.key }}-${{ hashFiles('macos/build-qemu-gpu-runtime.sh', 'macos/bundle-macho-dependencies.sh', 'macos/pinned-runtime-bottles.sh', 'macos/prepare-qemu-gpu-runtime.sh', 'macos/qemu-hvf.entitlements', 'macos/runtime-files.txt', 'macos/verify-macos-compatibility.sh', 'macos/patches/**', 'macos/Tests/virgl/**', 'scripts/build-cache.py') }}

      # build-cache.py re-verifies the fingerprint and rebuilds if it differs.
      - name: Build native runtime
        run: make runtime

      - name: Detect signing secrets
        id: signing
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          missing=()
          for name in MACOS_CERT_P12 MACOS_CERT_PASSWORD ASC_KEY_P8 ASC_KEY_ID ASC_ISSUER_ID; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          if ((${#missing[@]} == 0)); then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Signing and notarisation enabled."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Missing secrets: ${missing[*]}. Building an UNSIGNED, NOT NOTARISED DMG."
          fi

      - name: Import Developer ID certificate and notary key
        id: keychain
        if: steps.signing.outputs.enabled == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/release-signing.keychain-db"
          keychain_password=$(uuidgen)
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security default-keychain -d user -s "$keychain"
          identity=$(security find-identity -v -p codesigning "$keychain" \
            | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -1)
          [[ -n "$identity" ]] || { echo "::error::No Developer ID Application identity in MACOS_CERT_P12"; exit 1; }
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
          echo "keychain=$keychain" >> "$GITHUB_OUTPUT"
          key_file="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_KEY_P8" > "$key_file"
          xcrun notarytool store-credentials try-omarchy-ci \
            --key "$key_file" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" \
            --keychain "$keychain" --validate
          rm -f "$key_file"

      - name: Build signed and notarised DMG
        if: steps.signing.outputs.enabled == 'true'
        env:
          SIGN_IDENTITY: ${{ steps.keychain.outputs.identity }}
        run: |
          macos/build-app.sh --configuration production --dmg \
            --guest-dir "$GITHUB_WORKSPACE/dist/guest" \
            --sign-identity "$SIGN_IDENTITY" --notarize-profile try-omarchy-ci
          echo "DMG_KIND=signed" >> "$GITHUB_ENV"

      - name: Build unsigned DMG
        if: steps.signing.outputs.enabled != 'true'
        run: |
          macos/build-app.sh --configuration production --dmg \
            --guest-dir "$GITHUB_WORKSPACE/dist/guest" --sign-identity -
          echo "DMG_KIND=unsigned" >> "$GITHUB_ENV"

      - name: Name and checksum DMG
        run: |
          set -euo pipefail
          dmg=$(ls dist/*.dmg | head -1)
          suffix=$([[ "$DMG_KIND" == signed ]] && echo "" || echo "-UNSIGNED")
          out="dist/release/WizardOS-${RELEASE_TAG}${suffix}.dmg"
          mkdir -p dist/release
          cp "$dmg" "$out"
          (cd dist/release && shasum -a 256 "$(basename "$out")" > "$(basename "$out").sha256")
          {
            echo "### $RELEASE_TAG"
            if [[ "$DMG_KIND" == signed ]]; then
              echo "Signed with Developer ID and notarised."
            else
              echo "**UNSIGNED / NOT NOTARISED.** Signing secrets are missing; Gatekeeper will block this DMG. Do not publish it as an official release."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: dmg-${{ env.RELEASE_TAG }}
          path: dist/release/
          if-no-files-found: error

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Draft built by CI from $RELEASE_TAG ($DMG_KIND). Verify before publishing."
          [[ "$DMG_KIND" == signed ]] || notes="UNSIGNED, NOT NOTARISED build. $notes"
          if gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/release/* --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" dist/release/* --draft --verify-tag \
              --title "$RELEASE_TAG" --notes "$notes" -R "$GITHUB_REPOSITORY"
          fi

      - name: Remove signing keychain
        if: always() && steps.keychain.outputs.keychain != ''
        env:
          KEYCHAIN: ${{ steps.keychain.outputs.keychain }}
        run: security delete-keychain "$KEYCHAIN" || true
