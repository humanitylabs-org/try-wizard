name: Mac release

# Builds, signs and publishes the WizardOS Mac app (next/mac, the app people run) on GitHub-hosted runners only.
# No personal machine is involved (try-wizard#102, wizard-os#680).
#
# Separate jobs, so the signing key never meets project code:
#  1. build    macos-15, no secrets, no environment. Runs next/mac/build.sh (ad-hoc signed until Apple's Developer ID
#              exists) with the code-only guest update (next/guest/build-code-payload.py, try-wizard#123) and
#              next/mac/tools/stage-release.py: Sparkle zip, DMG, an appcast with the archive signature left
#              as a placeholder, and the downloads landing page.
#  2. sign     environment mac-sign (main only), secret SPARKLE_ED_PRIVATE_KEY. Runs only pinned download/upload-artifact
#              and Sparkle's sign_update from the checksum-pinned release below. No checkout, no project code.
#  3. publish  environment mac-publish (main only), secrets R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_SESSION_TOKEN and
#              CLOUDFLARE_ACCOUNT_ID: temporary R2 S3 credentials scoped to mac/ and mac-dryrun/ (7 days at most,
#              try-wizard#115). Uploads with the runner's aws CLI to downloads.aiwizards.com/<channel>/<build>/,
#              never overwrites a versioned key, checks every file byte for byte through the public URL, then
#              switches the appcast last (a real release also writes mac/index.html). No checkout, no project code.
#  upgrade-test (try-wizard#129; only with the switch on, below) macos-15, no secrets, no environment. Before publish:
#              the app the live mac/appcast.xml offers is installed and updates to the candidate, then the installed
#              candidate updates itself to a test-only copy with the build raised by one (built by build, signed by
#              sign, never published). Real Sparkle installs over a loopback feed; next/mac/tools/upgrade-test.py.
#              publish waits for it, so a candidate whose updater is broken never reaches the live feed.
#  4. tag      a real release tags the released commit v<version> and writes a GitHub release with the links.
#
# How a release starts: a PR that raises next/mac/release/version.json (version and build; the build must be higher
# than the live appcast's) merges to main. "Run workflow" on main runs it again; that run is a dry run unless dry_run
# is unticked. The environments only admit main, so a tag cannot start a release; the workflow pushes the tag itself.
# A dry run publishes to downloads.aiwizards.com/mac-dryrun/ and never touches mac/appcast.xml or index.html; a signing
# key that does not match the app's public key (next/mac/release/sparkle-public-key.txt) is a warning there and an
# error in a real release. Pull requests that touch next/mac run the build job only, as a native compile check.
#
# Release lanes (wizard-os#720, off by default): with the repository variable WOS_RELEASE_LANES=on, a real release is a
# tester build. It publishes to downloads.aiwizards.com/mac-beta/ (its signed feed and landing page also kept immutable
# under mac-beta/<build>/), never touches mac/, and its GitHub release is a prerelease. Installed apps read only
# mac/appcast.xml, so nobody is updated to it until the release train (promote.yml, every 6h, no person) finds it soaked
# 72h with no release-blocker open and copies that build's signed feed to mac/ with the same bytes, no rebuild.
# Switch (try-wizard#129, off by default): repo variable WOS_MAC_UPGRADE_TEST=on runs upgrade-test on every real and
# dry-run release; the "upgrade test" tick on Run workflow runs it for that one run. Off: the jobs run as before.
on:
  push:
    branches: [main]
    paths:
      - 'next/mac/release/version.json'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: publish to mac-dryrun/ only (untick for a real release)'
        type: boolean
        default: true
      upgrade_test:
        description: 'Upgrade test: live app -> this build -> this build + 1 before publishing (try-wizard#129)'
        type: boolean
        default: false
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'next/mac/**'
      - 'next/guest/**'

permissions:
  contents: read

concurrency:
  group: mac-release-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SPARKLE_VERSION: '2.10.0'
  SPARKLE_SHA256: c2bf58aa8387266ac179357b1415d6f2635f044da8be41042af32425dae6da0c
  DOWNLOADS: https://downloads.aiwizards.com
  BUCKET: aiwizards-downloads
  # try-wizard#129: the upgrade test's loopback feed (upgrade-test.py serves it on the upgrade-test runner).
  UPGRADE_LOOPBACK: http://127.0.0.1:48219

jobs:
  build:
    name: Build next/mac (macos-15, no secrets)
    runs-on: macos-15
    timeout-minutes: 45
    outputs:
      mode: ${{ steps.settings.outputs.mode }}
      channel: ${{ steps.settings.outputs.channel }}
      version: ${{ steps.settings.outputs.version }}
      build: ${{ steps.settings.outputs.build }}
      upgrade: ${{ steps.settings.outputs.upgrade }}
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Release settings
        id: settings
        env:
          EVENT: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
          LANES: ${{ vars.WOS_RELEASE_LANES }}
          UPGRADE_TEST: ${{ vars.WOS_MAC_UPGRADE_TEST == 'on' || inputs.upgrade_test == true }}
        run: |
          set -euo pipefail
          version=$(python3 -c 'import json;print(json.load(open("next/mac/release/version.json"))["version"])')
          build=$(python3 -c 'import json;print(json.load(open("next/mac/release/version.json"))["build"])')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::bad version $version"; exit 1; }
          [[ "$build" =~ ^[1-9][0-9]*$ ]] || { echo "::error::bad build $build"; exit 1; }
          if [[ "$EVENT" == pull_request ]]; then
            mode=check
          elif [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "::error::Mac releases run from main only (got $GITHUB_REF)"; exit 1
          elif [[ "$EVENT" == workflow_dispatch && "$DRY_RUN" == true ]]; then
            mode=dry-run
          else
            mode=release
          fi
          channel=$([[ "$mode" == dry-run ]] && echo mac-dryrun || echo mac)
          # Release lanes on (wizard-os#720): a real release is a tester build on mac-beta/, made public by promote.yml after 72h.
          if [[ "$mode" == release && "$LANES" == on ]]; then channel=mac-beta; fi
          if [[ "$mode" == release ]]; then
            live=$(curl -fsS "$DOWNLOADS/mac/appcast.xml?check=$GITHUB_RUN_ID" \
              | grep -o '<sparkle:version>[0-9]*</sparkle:version>' | tr -dc '0-9\n' | sort -n | tail -1)
            [[ "$live" =~ ^[0-9]+$ ]] || { echo "::error::could not read the live appcast build"; exit 1; }
            (( build > live )) || { echo "::error::build $build is not higher than the live appcast's $live; raise next/mac/release/version.json"; exit 1; }
            if [[ "$channel" == mac-beta ]]; then
              # No tester feed yet (the first tester build) counts as 0.
              beta=$(curl -sS "$DOWNLOADS/mac-beta/appcast.xml?check=$GITHUB_RUN_ID" \
                | grep -o '<sparkle:version>[0-9]*</sparkle:version>' | tr -dc '0-9\n' | sort -n | tail -1 || true)
              (( build > ${beta:-0} )) || { echo "::error::build $build is not higher than the tester appcast's $beta; raise next/mac/release/version.json"; exit 1; }
            fi
          fi
          # The upgrade test (try-wizard#129) runs only with its switch on, and only where something is signed.
          upgrade=no
          [[ "$UPGRADE_TEST" == true && "$mode" != check ]] && upgrade=yes
          printf 'mode=%s\nchannel=%s\nversion=%s\nbuild=%s\nupgrade=%s\n' "$mode" "$channel" "$version" "$build" "$upgrade" >> "$GITHUB_OUTPUT"
          echo "### WizardOS $version (build $build): $mode" >> "$GITHUB_STEP_SUMMARY"
          [[ "$upgrade" == yes ]] && echo "Upgrade test: on (live app -> $build -> $((build + 1)) before publishing)" >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Fetch Sparkle (checksum-pinned)
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/sparkle.tar.xz" \
            "https://github.com/sparkle-project/Sparkle/releases/download/$SPARKLE_VERSION/Sparkle-$SPARKLE_VERSION.tar.xz"
          echo "$SPARKLE_SHA256  $RUNNER_TEMP/sparkle.tar.xz" | shasum -a 256 -c
          mkdir -p "$RUNNER_TEMP/sparkle" && tar -xJf "$RUNNER_TEMP/sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle"

      - name: Build the app and DMG (ad-hoc signed)
        env:
          VER: ${{ steps.settings.outputs.version }}
          BUILD: ${{ steps.settings.outputs.build }}
          RELEASE_ID: ${{ github.sha }}
          SIGN_IDENTITY: '-'
        run: |
          set -euo pipefail
          export SPARKLE_DIR="$RUNNER_TEMP/sparkle"
          SPARKLE_PUBLIC_KEY=$(tr -d '[:space:]' < next/mac/release/sparkle-public-key.txt)
          export SPARKLE_PUBLIC_KEY SPARKLE_FEED="$DOWNLOADS/mac/appcast.xml"
          # The code-only guest update (try-wizard#123): this repo's guest files for the setup page and the Mac
          # window door, so guest fixes reach Macs with the version bump. No images; see next/guest/build-code-payload.py.
          python3 next/guest/build-code-payload.py --out "$RUNNER_TEMP/guest-update" --source-rev "$GITHUB_SHA"
          export GUEST_UPDATE_PAYLOAD="$RUNNER_TEMP/guest-update"
          next/mac/build.sh
          python3 - <<'PY'
          import json
          r = json.load(open('next/mac/dist/Wizard.app/Contents/Resources/wizard-release.json'))
          bom = json.load(open('next/mac/dist/Wizard.app/Contents/Resources/GuestUpdate/runtime-bom.json'))
          guest = [f for f in r['files'] if f.startswith('Contents/Resources/GuestUpdate/')]
          assert r['guestPatch'] == 'mac-stack-v1' and bom['kind'] == 'code-only', 'release carries no guest update'
          assert len(guest) == len(bom['files']) + 1, 'guest update files missing from the release contract'
          print('Guest update: code-only, %d files' % len(bom['files']))
          PY

      - name: Stage zip, DMG, appcast template and landing page
        env:
          VER: ${{ steps.settings.outputs.version }}
          BUILD: ${{ steps.settings.outputs.build }}
          CHANNEL: ${{ steps.settings.outputs.channel }}
        run: |
          set -euo pipefail
          python3 next/mac/tools/stage-release.py --app next/mac/dist/Wizard.app --dmg "next/mac/dist/Wizard-$VER.dmg" \
            --out "$RUNNER_TEMP/stage" --base-url "$DOWNLOADS/$CHANNEL" --version "$VER" --build "$BUILD"
          { echo '```'; cat "$RUNNER_TEMP/stage/release-stage.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify code signatures (app, DMG, update zip)
        env:
          VER: ${{ steps.settings.outputs.version }}
          BUILD: ${{ steps.settings.outputs.build }}
        run: |
          set -euo pipefail
          check() { # $1 app bundle: valid ad-hoc (or Developer ID) signature, expected version
            codesign --verify --deep --strict --verbose=2 "$1"
            codesign -dv "$1" 2>&1 | grep -E '^(Identifier|Signature|TeamIdentifier)='
            [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$1/Contents/Info.plist")" == "$BUILD" ]]
            [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$1/Contents/Info.plist")" == "$VER" ]]
          }
          check next/mac/dist/Wizard.app
          dmg=$(find "$RUNNER_TEMP/stage" -name "Wizard-$VER.dmg" -print -quit)
          zip=$(find "$RUNNER_TEMP/stage" -name "Wizard-$BUILD.zip" -print -quit)
          [[ -f "$dmg" && -f "$zip" ]] || { echo "::error::staged DMG or zip missing"; ls -R "$RUNNER_TEMP/stage"; exit 1; }
          hdiutil verify "$dmg"
          mnt=$(mktemp -d)
          hdiutil attach -readonly -nobrowse -mountpoint "$mnt" "$dmg" >/dev/null
          app=$(find "$mnt" -maxdepth 1 -name '*.app' -print -quit)
          check "$app"
          hdiutil detach "$mnt" >/dev/null
          unz=$(mktemp -d)
          ditto -x -k "$zip" "$unz"
          check "$(find "$unz" -maxdepth 1 -name '*.app' -print -quit)"
          echo "codesign --verify passed for the app, the app inside the DMG and the app inside the update zip" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload staged release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mac-stage
          path: ${{ runner.temp }}/stage/
          if-no-files-found: error
          retention-days: 7

      - name: Stage the upgrade test (candidate + 1 and loopback feeds; test-only, never published)
        if: steps.settings.outputs.upgrade == 'yes'
        env:
          VER: ${{ steps.settings.outputs.version }}
          BUILD: ${{ steps.settings.outputs.build }}
          CHANNEL: ${{ steps.settings.outputs.channel }}
          RELEASE_ID: ${{ github.sha }}
          SIGN_IDENTITY: '-'
        run: |
          set -euo pipefail
          up="$RUNNER_TEMP/upgrade"; mkdir -p "$up"
          # The candidate's own archive, offered by a feed on the loopback test server (sign signs it for this archive).
          python3 next/mac/tools/upgrade-test.py loopback-feed --template "$RUNNER_TEMP/stage/appcast.template.xml" \
            --out "$up/appcast-candidate.template.xml" --public-base "$DOWNLOADS/$CHANNEL" --loopback-base "$UPGRADE_LOOPBACK"
          # Candidate + 1: the same source and release ID with the build raised by one, built and sealed like the
          # candidate, so the installed candidate's updater has something newer to install.
          plus=$((BUILD + 1))
          export SPARKLE_DIR="$RUNNER_TEMP/sparkle" GUEST_UPDATE_PAYLOAD="$RUNNER_TEMP/guest-update" DMG=0
          SPARKLE_PUBLIC_KEY=$(tr -d '[:space:]' < next/mac/release/sparkle-public-key.txt)
          export SPARKLE_PUBLIC_KEY SPARKLE_FEED="$DOWNLOADS/mac/appcast.xml"
          BUILD=$plus next/mac/build.sh
          codesign --verify --deep --strict next/mac/dist/Wizard.app
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' next/mac/dist/Wizard.app/Contents/Info.plist)" == "$plus" ]]
          python3 next/mac/tools/stage-release.py --app next/mac/dist/Wizard.app --dmg "$RUNNER_TEMP/stage/Wizard-$VER.dmg" \
            --out "$up/plus-one" --base-url "$UPGRADE_LOOPBACK" --version "$VER" --build "$plus" > /dev/null
          rm -f "$up/plus-one/Wizard-$VER.dmg" "$up/plus-one/index.html"
          mv "$up/plus-one/appcast.template.xml" "$up/appcast-plus-one.template.xml"
          echo "Upgrade test staged: candidate $BUILD and test-only $plus on $UPGRADE_LOOPBACK" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the upgrade test's staged files
        if: steps.settings.outputs.upgrade == 'yes'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mac-upgrade-stage
          path: ${{ runner.temp }}/upgrade/
          if-no-files-found: error
          retention-days: 7

  sign:
    name: Sign the appcast (mac-sign)
    needs: build
    if: needs.build.outputs.mode == 'release' || needs.build.outputs.mode == 'dry-run'
    runs-on: macos-15
    environment: mac-sign
    timeout-minutes: 20
    outputs:
      signed: ${{ steps.sign.outputs.signed }}
      archive_sha256: ${{ steps.sign.outputs.archive_sha256 }}
    steps:
      - name: Download staged release
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: mac-stage
          path: stage

      - name: Download the upgrade test's staged files
        if: needs.build.outputs.upgrade == 'yes'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: mac-upgrade-stage
          path: upgrade

      - name: Fetch Sparkle sign_update (checksum-pinned)
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/sparkle.tar.xz" \
            "https://github.com/sparkle-project/Sparkle/releases/download/$SPARKLE_VERSION/Sparkle-$SPARKLE_VERSION.tar.xz"
          echo "$SPARKLE_SHA256  $RUNNER_TEMP/sparkle.tar.xz" | shasum -a 256 -c
          mkdir -p "$RUNNER_TEMP/sparkle" && tar -xJf "$RUNNER_TEMP/sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle" ./bin/sign_update

      - name: Sign archive and feed
        id: sign
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          MODE: ${{ needs.build.outputs.mode }}
          UPGRADE: ${{ needs.build.outputs.upgrade }}
        run: |
          set -euo pipefail
          if [[ -z "$SPARKLE_ED_PRIVATE_KEY" ]]; then
            echo "::warning::SPARKLE_ED_PRIVATE_KEY is not set in environment mac-sign: nothing signed or published."
            echo "Sparkle key not loaded yet: built only, nothing signed or published." >> "$GITHUB_STEP_SUMMARY"
            echo "signed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          sign_update() { printf '%s' "$SPARKLE_ED_PRIVATE_KEY" | "$RUNNER_TEMP/sparkle/bin/sign_update" --ed-key-file - "$@"; }
          field() { /usr/bin/plutil -extract "$1" raw -o - stage/release-stage.json; }
          archive="stage/$(field archive.name)"
          sum=$(shasum -a 256 "$archive" | cut -d' ' -f1)
          [[ "$sum" == "$(field archive.sha256)" ]] || { echo "::error::archive checksum changed between jobs"; exit 1; }

          sig=$(sign_update -p "$archive")
          [[ "$sig" =~ ^[A-Za-z0-9+/]{86}==$ ]] || { echo "::error::unexpected signature format"; exit 1; }
          [[ $(grep -c '@ED_SIGNATURE@' stage/appcast.template.xml) == 1 ]] || { echo "::error::appcast placeholder missing"; exit 1; }
          mkdir -p signed
          sed "s|@ED_SIGNATURE@|$sig|" stage/appcast.template.xml > signed/appcast.xml
          sign_update signed/appcast.xml
          sign_update --verify signed/appcast.xml
          sign_update --verify "$archive" "$sig"

          # Would installed apps accept these? Check both signatures against the public key the app was built with.
          cat > "$RUNNER_TEMP/verify.swift" <<'SWIFT'
          import CryptoKit
          import Foundation
          let a = CommandLine.arguments
          guard a.count == 4, let raw = Data(base64Encoded: a[1]), let sig = Data(base64Encoded: a[2]),
                let key = try? Curve25519.Signing.PublicKey(rawRepresentation: raw),
                let body = FileManager.default.contents(atPath: a[3]) else { exit(2) }
          exit(key.isValidSignature(sig, for: body) ? 0 : 1)
          SWIFT
          feed_sig=$(sed -n 's/^edSignature: //p' signed/appcast.xml)
          feed_len=$(sed -n 's/^length: //p' signed/appcast.xml)
          head -c "$feed_len" signed/appcast.xml > "$RUNNER_TEMP/feed.body"
          public=$(field publicKey)
          if xcrun swift "$RUNNER_TEMP/verify.swift" "$public" "$sig" "$archive" \
             && xcrun swift "$RUNNER_TEMP/verify.swift" "$public" "$feed_sig" "$RUNNER_TEMP/feed.body"; then
            echo "Signatures match the app's public key $public." >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$MODE" == dry-run ]]; then
            echo "::warning::Dry run: the signing key does not match the app's public key; installed apps must reject this feed."
            echo "Dry run: signing key does NOT match the app's public key (expected with a throwaway key)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::The mac-sign key does not match the public key built into the app; installed apps would reject this update."
            exit 1
          fi

          # The upgrade test (try-wizard#129): the same key signs two test-only feeds on the loopback server, one for
          # the archive above and one for the candidate + 1 archive. Neither is ever published.
          if [[ "$UPGRADE" == yes ]]; then
            mkdir -p signed-upgrade
            [[ $(grep -c '@ED_SIGNATURE@' upgrade/appcast-candidate.template.xml) == 1 ]] || { echo "::error::upgrade test feed placeholder missing"; exit 1; }
            sed "s|@ED_SIGNATURE@|$sig|" upgrade/appcast-candidate.template.xml > signed-upgrade/appcast-candidate.xml
            sign_update signed-upgrade/appcast-candidate.xml
            sign_update --verify signed-upgrade/appcast-candidate.xml
            plus_field() { /usr/bin/plutil -extract "$1" raw -o - upgrade/plus-one/release-stage.json; }
            plus_archive="upgrade/plus-one/$(plus_field archive.name)"
            [[ "$(shasum -a 256 "$plus_archive" | cut -d' ' -f1)" == "$(plus_field archive.sha256)" ]] || {
              echo "::error::candidate + 1 archive checksum changed between jobs"; exit 1; }
            plus_sig=$(sign_update -p "$plus_archive")
            [[ "$plus_sig" =~ ^[A-Za-z0-9+/]{86}==$ ]] || { echo "::error::unexpected signature format"; exit 1; }
            [[ $(grep -c '@ED_SIGNATURE@' upgrade/appcast-plus-one.template.xml) == 1 ]] || { echo "::error::upgrade test feed placeholder missing"; exit 1; }
            sed "s|@ED_SIGNATURE@|$plus_sig|" upgrade/appcast-plus-one.template.xml > signed-upgrade/appcast-plus-one.xml
            sign_update signed-upgrade/appcast-plus-one.xml
            sign_update --verify signed-upgrade/appcast-plus-one.xml
            sign_update --verify "$plus_archive" "$plus_sig"
            echo "Upgrade test feeds signed (test-only, never published)." >> "$GITHUB_STEP_SUMMARY"
          fi
          printf 'signed=true\narchive_sha256=%s\n' "$sum" >> "$GITHUB_OUTPUT"

      - name: Upload the upgrade test's signed feeds
        if: steps.sign.outputs.signed == 'true' && needs.build.outputs.upgrade == 'yes'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mac-upgrade-signed
          path: signed-upgrade/
          if-no-files-found: error
          retention-days: 7

      - name: Upload signed appcast
        if: steps.sign.outputs.signed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mac-signed
          path: signed/appcast.xml
          if-no-files-found: error
          retention-days: 7

  upgrade-test:
    name: Upgrade test (live app -> candidate -> candidate + 1)
    needs: [build, sign]
    if: needs.build.outputs.upgrade == 'yes' && needs.sign.outputs.signed == 'true'
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Download staged release
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: mac-stage
          path: ${{ runner.temp }}/stage

      - name: Download the upgrade test's staged files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: mac-upgrade-stage
          path: ${{ runner.temp }}/upgrade

      - name: Download the upgrade test's signed feeds
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: mac-upgrade-signed
          path: ${{ runner.temp }}/upgrade-signed

      - name: Live app -> candidate -> candidate + 1 (real Sparkle installs, loopback feed, no VM)
        run: |
          set -euo pipefail
          python3 next/mac/tools/upgrade-test.py run --live-feed "$DOWNLOADS/mac/appcast.xml" \
            --candidate "$RUNNER_TEMP/stage" --plus-one "$RUNNER_TEMP/upgrade/plus-one" \
            --signed "$RUNNER_TEMP/upgrade-signed" --work "$RUNNER_TEMP/upgrade-work" \
            --evidence "$RUNNER_TEMP/upgrade-evidence" --port "${UPGRADE_LOOPBACK##*:}"

      - name: Upload the upgrade test's logs and journals
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mac-upgrade-test-evidence
          path: ${{ runner.temp }}/upgrade-evidence/
          if-no-files-found: warn
          retention-days: 14

  publish:
    name: Publish to downloads.aiwizards.com (mac-publish)
    needs: [build, sign, upgrade-test]
    # upgrade-test is skipped only with its switch off (try-wizard#129); on, publish runs only after it passed.
    if: >-
      !cancelled() && needs.build.result == 'success' && needs.sign.result == 'success'
      && needs.sign.outputs.signed == 'true'
      && (needs.upgrade-test.result == 'success'
          || (needs.upgrade-test.result == 'skipped' && needs.build.outputs.upgrade != 'yes'))
    runs-on: ubuntu-latest
    environment: mac-publish
    timeout-minutes: 30
    steps:
      - name: Download staged release
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: mac-stage
          path: stage

      - name: Download signed appcast
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: mac-signed
          path: signed

      - name: Upload versioned files, verify, then switch the feed
        env:
          # Temporary R2 S3 credentials (try-wizard#115): bucket aiwizards-downloads, prefixes mac/ and mac-dryrun/ (and
          # mac-beta/ for release lanes, wizard-os#720),
          # object read-write, at most 7 days. Archimedes mints fresh ones weekly; GitHub never holds an account token.
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.R2_SESSION_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: 'true'
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          AWS_PAGER: ''
          MODE: ${{ needs.build.outputs.mode }}
          CHANNEL: ${{ needs.build.outputs.channel }}
          BUILD: ${{ needs.build.outputs.build }}
          SIGNED_SHA256: ${{ needs.sign.outputs.archive_sha256 }}
        run: |
          set -euo pipefail
          for v in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            [[ -n "${!v}" ]] || {
              echo "::error::R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY / R2_SESSION_TOKEN / CLOUDFLARE_ACCOUNT_ID are not all set in environment mac-publish"
              exit 1; }
          done
          [[ "$CHANNEL" == mac || "$CHANNEL" == mac-dryrun || "$CHANNEL" == mac-beta ]] || { echo "::error::unexpected channel $CHANNEL"; exit 1; }
          command -v aws > /dev/null || { echo "::error::the runner has no aws CLI"; exit 1; }
          endpoint="https://$CLOUDFLARE_ACCOUNT_ID.r2.cloudflarestorage.com"
          s3() { aws --endpoint-url "$endpoint" --output json s3api "$@"; }
          err="$RUNNER_TEMP/s3.err"
          expired() { # $1 what was attempted; reads the last S3 error
            if grep -qiE 'ExpiredToken|expired|InvalidAccessKeyId|InvalidToken|SignatureDoesNotMatch|Unauthorized' "$err"; then
              echo "::error::The R2 temporary credentials in mac-publish expired or were revoked ($1). Mint new 7-day credentials and load them into the environment."
            else
              echo "::error::$1 failed: $(tr '\n' ' ' < "$err")"
            fi
          }

          field() { jq -er "$1" stage/release-stage.json; }
          [[ "$(field .build)" == "$BUILD" ]] || { echo "::error::staged build differs"; exit 1; }
          archive="stage/$(field .archive.name)"; dmg="stage/$(field .dmg.name)"
          [[ "$(sha256sum "$archive" | cut -d' ' -f1)" == "$SIGNED_SHA256" ]] || { echo "::error::archive is not the one that was signed"; exit 1; }
          [[ "$(sha256sum "$dmg" | cut -d' ' -f1)" == "$(field .dmg.sha256)" ]] || { echo "::error::DMG checksum changed"; exit 1; }
          if [[ "$MODE" == release ]]; then
            live=$(curl -fsS "$DOWNLOADS/mac/appcast.xml?check=$GITHUB_RUN_ID-publish" \
              | grep -o '<sparkle:version>[0-9]*</sparkle:version>' | tr -dc '0-9\n' | sort -n | tail -1)
            (( BUILD > live )) || { echo "::error::build $BUILD is not higher than the live appcast's $live"; exit 1; }
            if [[ "$CHANNEL" == mac-beta ]]; then
              beta=$(curl -sS "$DOWNLOADS/mac-beta/appcast.xml?check=$GITHUB_RUN_ID-publish" \
                | grep -o '<sparkle:version>[0-9]*</sparkle:version>' | tr -dc '0-9\n' | sort -n | tail -1 || true)
              (( BUILD > ${beta:-0} )) || { echo "::error::build $BUILD is not higher than the tester appcast's $beta"; exit 1; }
            fi
          fi

          # The credentials work (a clear error if they expired) and cannot write outside mac/, mac-beta/ and mac-dryrun/.
          if ! s3 get-object --bucket "$BUCKET" --key "$CHANNEL/appcast.xml" "$RUNNER_TEMP/feed.bin" > /dev/null 2> "$err" \
             && ! grep -q NoSuchKey "$err"; then
            expired "reading $CHANNEL/appcast.xml"; exit 1
          fi
          probe="publish-scope-check/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.txt"
          : > "$RUNNER_TEMP/empty"
          if s3 put-object --bucket "$BUCKET" --key "$probe" --body "$RUNNER_TEMP/empty" > /dev/null 2> "$err"; then
            s3 delete-object --bucket "$BUCKET" --key "$probe" > /dev/null || true
            echo "::error::the mac-publish credentials can write outside mac/, mac-beta/ and mac-dryrun/; load bucket-scoped temporary credentials"
            exit 1
          elif ! grep -q AccessDenied "$err"; then
            expired "the scope check"; exit 1
          fi
          echo "Credentials checked: writing $probe was refused (AccessDenied)." >> "$GITHUB_STEP_SUMMARY"

          n=0
          fetch() { n=$((n + 1)); curl -sS -o "$RUNNER_TEMP/public.bin" -w '%{http_code}' "$DOWNLOADS/$1?v=$GITHUB_RUN_ID-$n"; }
          put() { # key file content-type cache-control versioned(yes|no)
            local key=$1 file=$2 type=$3 cache=$4 versioned=$5 want code
            want=$(sha256sum "$file" | cut -d' ' -f1)
            if [[ "$versioned" == yes ]]; then
              if s3 head-object --bucket "$BUCKET" --key "$key" > /dev/null 2> "$err"; then
                s3 get-object --bucket "$BUCKET" --key "$key" "$RUNNER_TEMP/existing.bin" > /dev/null 2> "$err" || {
                  expired "reading $key"; return 1; }
                if [[ "$(sha256sum "$RUNNER_TEMP/existing.bin" | cut -d' ' -f1)" == "$want" ]]; then
                  echo "$key is already published with the same bytes"; return 0
                elif [[ "$MODE" != dry-run ]]; then
                  echo "::error::$key already exists with different bytes; versioned paths are never overwritten"; return 1
                fi
              elif ! grep -qE '\(404\)|Not Found|NoSuchKey' "$err"; then
                expired "checking $key"; return 1
              fi
            fi
            s3 put-object --bucket "$BUCKET" --key "$key" --body "$file" \
              --content-type "$type" --cache-control "$cache" > /dev/null 2> "$err" || { expired "uploading $key"; return 1; }
            code=$(fetch "$key")
            [[ "$code" == 200 && "$(sha256sum "$RUNNER_TEMP/public.bin" | cut -d' ' -f1)" == "$want" ]] || {
              echo "::error::$key did not read back byte for byte (HTTP $code)"; return 1; }
            echo "Published $DOWNLOADS/$key" | tee -a "$GITHUB_STEP_SUMMARY"
          }
          immutable='public, max-age=31536000, immutable'
          put "$CHANNEL/$BUILD/$(basename "$archive")" "$archive" application/zip "$immutable" yes
          put "$CHANNEL/$BUILD/$(basename "$dmg")" "$dmg" application/x-apple-diskimage "$immutable" yes
          if [[ "$MODE" == release && "$CHANNEL" == mac ]]; then
            # The credentials stop at mac/, so the landing page goes to mac/index.html; the root page is not touched.
            put mac/index.html stage/index.html 'text/html; charset=utf-8' no-cache no
          elif [[ "$MODE" == release ]]; then
            # A tester build (wizard-os#720) keeps its signed feed and page per build, so promote.yml can later copy
            # exactly these bytes to mac/ without signing anything again.
            put "$CHANNEL/$BUILD/appcast.xml" signed/appcast.xml application/xml "$immutable" yes
            put "$CHANNEL/$BUILD/index.html" stage/index.html 'text/html; charset=utf-8' "$immutable" yes
            put "$CHANNEL/index.html" stage/index.html 'text/html; charset=utf-8' no-cache no
          fi
          put "$CHANNEL/appcast.xml" signed/appcast.xml application/xml no-cache no

  tag:
    name: Tag v<version>
    needs: [build, publish]
    # !cancelled(): without it GitHub adds success(), which is false whenever upgrade-test (needed by publish) was
    # skipped, so no release was ever tagged with that switch off (try-wizard#195).
    if: "!cancelled() && needs.build.outputs.mode == 'release' && needs.publish.result == 'success'"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Tag the released commit and write the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          BUILD: ${{ needs.build.outputs.build }}
          CHANNEL: ${{ needs.build.outputs.channel }}
        run: |
          set -euo pipefail
          # No channel output (lanes off, or an older caller) means the public mac channel, as before wizard-os#720.
          CHANNEL="${CHANNEL:-mac}"
          tag="v$VERSION"
          # gh prints GitHub's 404 body on stdout, so only its output on success is a tag (try-wizard#182).
          if ! existing=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq .object.sha 2>/dev/null); then
            existing=
          fi
          if [[ -z "$existing" ]]; then
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" > /dev/null
          elif [[ "$existing" != "$GITHUB_SHA" ]]; then
            echo "::error::$tag already points at $existing"; exit 1
          fi
          notes="Built, signed and published by the Mac release workflow: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          Download: $DOWNLOADS/$CHANNEL/$BUILD/Wizard-$VERSION.dmg
          In-app update feed: $DOWNLOADS/mac/appcast.xml (Sparkle-signed)
          Ad-hoc signed and not notarised until the Apple Developer ID exists."
          lane=()
          if [[ "$CHANNEL" == mac-beta ]]; then
            # A tester build (wizard-os#720): a prerelease until promote.yml makes it public after its 72h soak.
            lane=(--prerelease --latest=false)
            notes="$notes
          Tester build: installed apps are offered it once it has soaked 72h with no release-blocker open (promote.yml)."
          fi
          gh release view "$tag" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1 || gh release create "$tag" -R "$GITHUB_REPOSITORY" \
            --verify-tag --title "WizardOS $VERSION for Mac (build $BUILD)" --notes "$notes" ${lane[@]+"${lane[@]}"}
