name: proof-195 (temporary, removed before merge)
on: pull_request
jobs:
  build-off:
    runs-on: ubuntu-latest
    outputs: {mode: release, upgrade: 'no'}
    steps: [{run: 'true'}]
  sign-off:
    needs: build-off
    runs-on: ubuntu-latest
    outputs: {signed: 'true'}
    steps: [{run: 'true'}]
  upgrade-test-off:
    needs: [build-off, sign-off]
    if: needs.build-off.outputs.upgrade == 'yes' && needs.sign-off.outputs.signed == 'true'
    runs-on: ubuntu-latest
    steps: [{run: 'true'}]
  publish-off:
    needs: [build-off, sign-off, upgrade-test-off]
    if: >-
      !cancelled() && needs.build-off.result == 'success' && needs.sign-off.result == 'success'
      && needs.sign-off.outputs.signed == 'true'
      && (needs.upgrade-test-off.result == 'success'
          || (needs.upgrade-test-off.result == 'skipped' && needs.build-off.outputs.upgrade != 'yes'))
    runs-on: ubuntu-latest
    steps: [{run: 'true'}]
  tag-old-off:
    needs: [build-off, publish-off]
    if: needs.build-off.outputs.mode == 'release' && needs.publish-off.result == 'success'
    runs-on: ubuntu-latest
    steps: [{run: 'true'}]
  tag-new-off:
    needs: [build-off, publish-off]
    if: "!cancelled() && needs.build-off.outputs.mode == 'release' && needs.publish-off.result == 'success'"
    runs-on: ubuntu-latest
    steps: [{run: 'true'}]
  build-on:
    runs-on: ubuntu-latest
    outputs: {mode: release, upgrade: 'yes'}
    steps: [{run: 'true'}]
  sign-on:
    needs: build-on
    runs-on: ubuntu-latest
    outputs: {signed: 'true'}
    steps: [{run: 'true'}]
  upgrade-test-on:
    needs: [build-on, sign-on]
    if: needs.build-on.outputs.upgrade == 'yes' && needs.sign-on.outputs.signed == 'true'
    runs-on: ubuntu-latest
    steps: [{run: 'true'}]
  publish-on:
    needs: [build-on, sign-on, upgrade-test-on]
    if: >-
      !cancelled() && needs.build-on.result == 'success' && needs.sign-on.result == 'success'
      && needs.sign-on.outputs.signed == 'true'
      && (needs.upgrade-test-on.result == 'success'
          || (needs.upgrade-test-on.result == 'skipped' && needs.build-on.outputs.upgrade != 'yes'))
    runs-on: ubuntu-latest
    steps: [{run: 'true'}]
  tag-old-on:
    needs: [build-on, publish-on]
    if: needs.build-on.outputs.mode == 'release' && needs.publish-on.result == 'success'
    runs-on: ubuntu-latest
    steps: [{run: 'true'}]
  tag-new-on:
    needs: [build-on, publish-on]
    if: "!cancelled() && needs.build-on.outputs.mode == 'release' && needs.publish-on.result == 'success'"
    runs-on: ubuntu-latest
    steps: [{run: 'true'}]
  build-onfail:
    runs-on: ubuntu-latest
    outputs: {mode: release, upgrade: 'yes'}
    steps: [{run: 'true'}]
  sign-onfail:
    needs: build-onfail
    runs-on: ubuntu-latest
    outputs: {signed: 'true'}
    steps: [{run: 'true'}]
  upgrade-test-onfail:
    needs: [build-onfail, sign-onfail]
    if: needs.build-onfail.outputs.upgrade == 'yes' && needs.sign-onfail.outputs.signed == 'true'
    runs-on: ubuntu-latest
    steps: [{run: 'false'}]
  publish-onfail:
    needs: [build-onfail, sign-onfail, upgrade-test-onfail]
    if: >-
      !cancelled() && needs.build-onfail.result == 'success' && needs.sign-onfail.result == 'success'
      && needs.sign-onfail.outputs.signed == 'true'
      && (needs.upgrade-test-onfail.result == 'success'
          || (needs.upgrade-test-onfail.result == 'skipped' && needs.build-onfail.outputs.upgrade != 'yes'))
    runs-on: ubuntu-latest
    steps: [{run: 'true'}]
  tag-old-onfail:
    needs: [build-onfail, publish-onfail]
    if: needs.build-onfail.outputs.mode == 'release' && needs.publish-onfail.result == 'success'
    runs-on: ubuntu-latest
    steps: [{run: 'true'}]
  tag-new-onfail:
    needs: [build-onfail, publish-onfail]
    if: "!cancelled() && needs.build-onfail.outputs.mode == 'release' && needs.publish-onfail.result == 'success'"
    runs-on: ubuntu-latest
    steps: [{run: 'true'}]
